<style>
:root{
  --bg:#f5f3f8;
  --purple:#401e97;
  --purple-soft:#6a3fd0;
  --ink:#17151d;
  --paper:#f8f4e9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121016;
  }
}

:root[data-theme="dark"]{
  --bg:#121016;
}

html{
  scroll-padding-top:env(safe-area-inset-top,0px);
}

html,
body{
  margin:0;
  height:100%;
}

body{
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

svg{
  width:100%;
  max-width:1200px;
  height:auto;
  display:block;
}

.h{
  font-family:Caveat,'Segoe Print','Bradley Hand',cursive;
  font-weight:600;
}

.u{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
}

a{
  outline:none;
  cursor:pointer;
}

.lift{
  transform-origin:center;
  transition:
    transform .22s cubic-bezier(.2,.8,.2,1),
    filter .22s ease;
}

a:hover .lift,
a:focus-visible .lift{
  transform:translateY(-5px);
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.18));
}

a:active .lift{
  transform:translateY(-1px) scale(.985);
}

a:focus-visible .lift{
  outline:2px solid #fff;
  outline-offset:4px;
}

.desk-item{
  transform-box:fill-box;
  transform-origin:center;
  transition:
    transform .35s cubic-bezier(.2,.8,.2,1),
    filter .35s ease;
}

.desk-item:hover{
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.18));
}

@media(prefers-reduced-motion:reduce){
  .lift,
  .desk-item{
    transition:none;
  }
}
</style>
</head>

<script>
/*
  Very subtle cursor movement.
  It only affects the existing interactive desk objects.
  The illustration itself stays intact.
*/

(() => {
  const svg = document.querySelector("svg");

  if (!svg || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    return;
  }

  const interactiveItems = document.querySelectorAll(
    ".desk-item, a .lift"
  );

  let mouseX = 0;
  let mouseY = 0;
  let currentX = 0;
  let currentY = 0;

  window.addEventListener("pointermove", (event) => {
    mouseX = (event.clientX / window.innerWidth - 0.5);
    mouseY = (event.clientY / window.innerHeight - 0.5);
  });

  function animate() {

    currentX += (mouseX - currentX) * 0.035;
    currentY += (mouseY - currentY) * 0.035;

    interactiveItems.forEach((item, index) => {

      const strength = index % 3 === 0 ? 2.2 : 1.4;

      const x = currentX * strength;
      const y = currentY * strength;

      item.style.translate = `${x}px ${y}px`;

    });

    requestAnimationFrame(animate);
  }

  animate();
})();
</script>
