<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect width="1000" height="1000" fill="#EEF1EC"/>

  <!-- Ripple rings -->
  <g fill="none" stroke="#0F3D3E" stroke-width="1.5">
    <circle cx="500" cy="500" r="120" opacity="0.45"/>
    <circle cx="500" cy="500" r="200" opacity="0.35"/>
    <circle cx="500" cy="500" r="280" opacity="0.28"/>
    <circle cx="500" cy="500" r="360" opacity="0.2"/>
    <circle cx="500" cy="500" r="440" opacity="0.12"/>
  </g>

  <!-- Accent arc -->
  <path d="M640 257.5 A280 280 0 0 1 780 500" fill="none" stroke="#FF7A59" stroke-width="6" stroke-linecap="round"/>

  <!-- Connections from centre -->
  <g stroke="#0F3D3E" stroke-width="1.5" opacity="0.55">
    <line x1="500" y1="500" x2="673" y2="400"/>
    <line x1="500" y1="500" x2="465" y2="697"/>
    <line x1="500" y1="500" x2="312" y2="383"/>
    <line x1="500" y1="500" x2="585" y2="585"/>
    <line x1="500" y1="500" x2="415" y2="415"/>
  </g>

  <!-- Secondary connections -->
  <g stroke="#0F3D3E" stroke-width="1.2" opacity="0.35">
    <line x1="673" y1="400" x2="763" y2="596"/>
    <line x1="673" y1="400" x2="680" y2="188"/>
    <line x1="465" y1="697" x2="286" y2="680"/>
    <line x1="465" y1="697" x2="680" y2="812"/>
    <line x1="312" y1="383" x2="188" y2="320"/>
    <line x1="312" y1="383" x2="145" y2="563"/>
    <line x1="763" y1="596" x2="933" y2="424"/>
    <line x1="286" y1="680" x2="350" y2="914"/>
    <line x1="312" y1="383" x2="451" y2="224"/>
  </g>

  <!-- Dashed outreach trajectory -->
  <path d="M500 500 Q640 300 726 160" fill="none" stroke="#FF7A59" stroke-width="2.5" stroke-dasharray="4 10" stroke-linecap="round"/>

  <!-- Nodes: inner ring -->
  <g fill="#0F3D3E">
    <circle cx="585" cy="585" r="7"/>
    <circle cx="415" cy="415" r="7"/>
  </g>

  <!-- Nodes: filled -->
  <g fill="#0F3D3E">
    <circle cx="673" cy="400" r="12"/>
    <circle cx="465" cy="697" r="12"/>
    <circle cx="312" cy="383" r="12"/>
    <circle cx="763" cy="596" r="9"/>
    <circle cx="286" cy="680" r="9"/>
    <circle cx="680" cy="812" r="9"/>
    <circle cx="188" cy="320" r="7"/>
    <circle cx="933" cy="424" r="6"/>
  </g>

  <!-- Nodes: hollow -->
  <g fill="#EEF1EC" stroke="#0F3D3E" stroke-width="2">
    <circle cx="451" cy="224" r="9"/>
    <circle cx="145" cy="563" r="9"/>
    <circle cx="350" cy="914" r="7"/>
    <circle cx="680" cy="188" r="10"/>
  </g>

  <!-- Accent nodes -->
  <g fill="#FF7A59">
    <circle cx="780" cy="500" r="9"/>
    <circle cx="640" cy="257.5" r="9"/>
  </g>

  <!-- Centre node -->
  <circle cx="500" cy="500" r="52" fill="none" stroke="#FF7A59" stroke-width="2" opacity="0.6"/>
  <circle cx="500" cy="500" r="34" fill="#FF7A59"/>
  <circle cx="500" cy="500" r="11" fill="#EEF1EC"/>

  <!-- Paper plane -->
  <g transform="translate(740 148) rotate(-28)">
    <polygon points="-34,10 40,-16 -2,28" fill="#0F3D3E"/>
    <polygon points="-34,10 -2,28 -6,6" fill="#FF7A59"/>
  </g>
</svg>
