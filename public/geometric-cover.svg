<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect width="800" height="1100" fill="#F4E8D8"/>

  <!-- Big red triangle -->
  <polygon points="0,0 470,0 0,570" fill="#E8453C"/>

  <!-- Yellow square + blue half-disc -->
  <rect x="470" y="70" width="300" height="300" fill="#F9C22E"/>
  <path d="M370 370 A150 150 0 0 1 670 370 Z" fill="#1F4FA3"/>

  <!-- Pink quarter circle bottom-right -->
  <path d="M800 1100 L800 880 A220 220 0 0 0 580 1100 Z" fill="#F4B6C8"/>

  <!-- Stair step line -->
  <path d="M60 610 H150 V670 H240 V730 H330 V790 H420" fill="none" stroke="#1F4FA3" stroke-width="16" stroke-linejoin="miter"/>

  <!-- Black bars -->
  <rect x="440" y="410" width="16" height="170" fill="#1A1A1A"/>
  <rect x="60" y="1030" width="220" height="16" fill="#1A1A1A"/>
  <rect x="560" y="400" width="190" height="16" fill="#1A1A1A"/>

  <!-- Dot grid -->
  <g fill="#1A1A1A">
    <circle cx="500" cy="470" r="8"/><circle cx="540" cy="470" r="8"/><circle cx="580" cy="470" r="8"/><circle cx="620" cy="470" r="8"/>
    <circle cx="500" cy="510" r="8"/><circle cx="540" cy="510" r="8"/><circle cx="580" cy="510" r="8"/><circle cx="620" cy="510" r="8"/>
    <circle cx="500" cy="550" r="8"/><circle cx="540" cy="550" r="8"/><circle cx="580" cy="550" r="8"/><circle cx="620" cy="550" r="8"/>
  </g>

  <!-- Diagonal capsule with blue inner stripe -->
  <line x1="320" y1="1010" x2="730" y2="600" stroke="#1A1A1A" stroke-width="110" stroke-linecap="round"/>
  <line x1="340" y1="990" x2="710" y2="620" stroke="#1F4FA3" stroke-width="22" stroke-linecap="round"/>
  <!-- Capsule end rings -->
  <circle cx="730" cy="600" r="34" fill="#F4E8D8"/>
  <circle cx="730" cy="600" r="14" fill="#E8453C"/>
  <circle cx="320" cy="1010" r="34" fill="#F9C22E"/>
  <circle cx="320" cy="1010" r="12" fill="#1A1A1A"/>

  <!-- Stacked yellow half-discs -->
  <g fill="#F9C22E">
    <path d="M60 900 A55 55 0 0 1 170 900 Z"/>
    <path d="M60 940 A55 55 0 0 1 170 940 Z"/>
    <path d="M60 980 A55 55 0 0 1 170 980 Z"/>
  </g>

  <!-- Red circle with black ring -->
  <circle cx="230" cy="830" r="52" fill="#E8453C"/>
  <circle cx="230" cy="830" r="52" fill="none" stroke="#1A1A1A" stroke-width="8"/>

  <!-- Small accents -->
  <polygon points="690,780 750,780 720,730" fill="#E8453C"/>
  <rect x="650" y="880" width="60" height="60" fill="#1F4FA3"/>
  <circle cx="110" cy="130" r="0" fill="none"/>
  <circle cx="560" cy="660" r="20" fill="#F9C22E"/>
</svg>
