<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1930 1900" role="img" aria-label="OmoGiwa logo hopping happily and throwing confetti" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>OmoGiwa hop</title>
  <defs>
    <clipPath id="eyeClip"><circle r="268"/></clipPath>
    <style>
      .a { animation-duration: 4.8s; animation-iteration-count: infinite; animation-fill-mode: both;
           animation-timing-function: ease-in-out; }

      /* ---- the jump: up fast, down fast, slow at the top ---- */
      #hop { animation-name: hop; }
      @keyframes hop {
        0%,5%    { transform: translateY(0);      animation-timing-function: cubic-bezier(.2,.7,.3,1); }
        12%      { transform: translateY(-250px); animation-timing-function: cubic-bezier(.6,0,.8,.4); }
        21%,30%  { transform: translateY(0);      animation-timing-function: cubic-bezier(.2,.7,.3,1); }
        37%      { transform: translateY(-250px); animation-timing-function: cubic-bezier(.6,0,.8,.4); }
        46%,57%  { transform: translateY(0);      animation-timing-function: cubic-bezier(.2,.7,.3,1); }
        68%      { transform: translateY(-650px); animation-timing-function: cubic-bezier(.6,0,.8,.4); }
        82%,100% { transform: translateY(0); }
      }

      /* ---- squash and stretch (scales from the ground contact point) ---- */
      #squash { animation-name: squash; }
      @keyframes squash {
        0%     { transform: scale(1,1); }
        2.5%   { transform: scale(1.12,.88); }
        5%     { transform: scale(.92,1.12); }
        12%    { transform: scale(.96,1.05); }
        19%    { transform: scale(.94,1.1); }
        21%    { transform: scale(1.18,.82); }
        25%    { transform: scale(1,1); }
        27.5%  { transform: scale(1.12,.88); }
        30%    { transform: scale(.92,1.12); }
        37%    { transform: scale(.96,1.05); }
        44%    { transform: scale(.94,1.1); }
        46%    { transform: scale(1.18,.82); }
        50%    { transform: scale(1,1); }
        53%    { transform: scale(1.2,.8); }
        57%    { transform: scale(.88,1.18); }
        68%    { transform: scale(.94,1.08); }
        80%    { transform: scale(.9,1.14); }
        82%    { transform: scale(1.3,.7); }
        86%    { transform: scale(.96,1.06); }
        90%    { transform: scale(1.03,.97); }
        94%,100% { transform: scale(1,1); }
      }

      /* ---- little tilts on the small hops, full flip on the big one ---- */
      #tilt { animation-name: tilt; }
      @keyframes tilt {
        0%       { transform: rotate(0deg); }
        12%      { transform: rotate(-8deg); }
        21%      { transform: rotate(0deg); }
        37%      { transform: rotate(8deg); }
        46%,57%  { transform: rotate(0deg); }
        80%,100% { transform: rotate(360deg); }
      }

      /* ---- the eye looks where it's going ---- */
      #look { animation-name: look; }
      @keyframes look {
        0%   { transform: translate(0,0); }
        10%  { transform: translate(30px,-30px); }
        25%  { transform: translate(-30px,0); }
        35%  { transform: translate(30px,-30px); }
        50%  { transform: translate(-30px,0); }
        66%  { transform: translate(0,-40px); }
        84%  { transform: translate(0,25px); }
        100% { transform: translate(0,0); }
      }
      #blink { animation-name: blink; }
      @keyframes blink {
        0%,39%  { transform: scaleY(1); }
        41%     { transform: scaleY(.08); }
        43%,93% { transform: scaleY(1); }
        95%     { transform: scaleY(.08); }
        97%,100%{ transform: scaleY(1); }
      }
      /* the wedge whirls during the flip */
      #hand { animation-name: hand; }
      @keyframes hand { 0%,57% { transform: rotate(0deg); } 80%,100% { transform: rotate(720deg); } }

      /* ---- shadow shrinks when he's high up ---- */
      #shadow { transform-box: fill-box; transform-origin: center; animation-name: shadow; }
      @keyframes shadow {
        0%,5%    { transform: scale(1);   opacity: .9; }
        12%      { transform: scale(.75); opacity: .6; }
        21%,30%  { transform: scale(1);   opacity: .9; }
        37%      { transform: scale(.75); opacity: .6; }
        46%,57%  { transform: scale(1);   opacity: .9; }
        68%      { transform: scale(.45); opacity: .35; }
        82%      { transform: scale(1.1); opacity: .9; }
        90%,100% { transform: scale(1);   opacity: .9; }
      }

      /* ---- confetti burst on the big landing ---- */
      .c { opacity: 0; animation-name: confetti; animation-timing-function: cubic-bezier(.2,.7,.4,1); }
      @keyframes confetti {
        0%,82%  { opacity: 0; transform: translate(0,0) rotate(0deg) scale(0); }
        84%     { opacity: 1; transform: translate(calc(var(--dx) * .3), calc(var(--dy) * .3)) rotate(calc(var(--r) * .3)) scale(1); }
        92%     { opacity: 1; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); }
        100%    { opacity: 0; transform: translate(calc(var(--dx) * 1.15), calc(var(--dy) + 380px)) rotate(calc(var(--r) * 1.5)) scale(.8); }
      }

      @media (prefers-reduced-motion: reduce) { .a { animation: none !important; } }
    </style>
  </defs>

  <!-- ground -->
  <line x1="300" y1="1712" x2="1630" y2="1712" stroke="#efe7fb" stroke-width="16" stroke-linecap="round"/>
  <ellipse id="shadow" class="a" cx="965" cy="1712" rx="420" ry="46" fill="#411f96" fill-opacity=".18"/>

  <!-- the character: origin = ground contact point -->
  <g transform="translate(965 1700)">
    <g id="hop" class="a"><g id="squash" class="a">
      <g transform="translate(0 -417)">
        <g id="tilt" class="a">
          <g transform="scale(.62)">
            <!-- G -->
            <path transform="translate(-945 -893)" fill="#411f96" fill-rule="evenodd" d="
              M1518 454 C1370 285 1200 220 970 220 C560 220 260 560 260 905
              C260 1260 540 1566 960 1566 C1400 1566 1630 1250 1630 875
              L1630 818 L930 818 L930 1070 L1312 1075
              C1270 1240 1130 1324 960 1324 C700 1324 563 1130 563 907
              C563 680 730 490 970 490 C1120 490 1230 550 1316 656 Z"/>
            <!-- O (eye) -->
            <g transform="translate(12 4)">
              <g id="look" class="a"><g id="blink" class="a">
                <circle r="268" fill="#000"/>
                <g clip-path="url(#eyeClip)">
                  <g id="hand" class="a"><path d="M0 0 L268 0 A268 268 0 0 1 0 268 Z" fill="#ac5fe6"/></g>
                </g>
              </g></g>
            </g>
          </g>
        </g>
      </g>
    </g></g>
  </g>

  <!-- confetti -->
  <g transform="translate(965 1650)">
    <g class="c a" style="--dx:-620px;--dy:-780px;--r:240deg"><rect x="-22" y="-22" width="44" height="44" fill="#411f96"/></g>
    <g class="c a" style="--dx:-470px;--dy:-1000px;--r:-200deg"><circle r="26" fill="#ac5fe6"/></g>
    <g class="c a" style="--dx:-300px;--dy:-870px;--r:300deg"><rect x="-30" y="-12" width="60" height="24" fill="#e5252a"/></g>
    <g class="c a" style="--dx:-150px;--dy:-1100px;--r:-260deg"><rect x="-20" y="-20" width="40" height="40" fill="#ac5fe6"/></g>
    <g class="c a" style="--dx:0px;--dy:-980px;--r:180deg"><circle r="22" fill="#e5252a"/></g>
    <g class="c a" style="--dx:170px;--dy:-1120px;--r:320deg"><rect x="-30" y="-12" width="60" height="24" fill="#411f96"/></g>
    <g class="c a" style="--dx:330px;--dy:-900px;--r:-240deg"><circle r="26" fill="#411f96"/></g>
    <g class="c a" style="--dx:480px;--dy:-1030px;--r:210deg"><rect x="-22" y="-22" width="44" height="44" fill="#e5252a"/></g>
    <g class="c a" style="--dx:640px;--dy:-760px;--r:-300deg"><rect x="-30" y="-12" width="60" height="24" fill="#ac5fe6"/></g>
    <g class="c a" style="--dx:-760px;--dy:-520px;--r:160deg"><circle r="20" fill="#ac5fe6"/></g>
    <g class="c a" style="--dx:760px;--dy:-540px;--r:-180deg"><circle r="20" fill="#411f96"/></g>
    <g class="c a" style="--dx:-220px;--dy:-700px;--r:280deg"><rect x="-18" y="-18" width="36" height="36" fill="#411f96"/></g>
    <g class="c a" style="--dx:260px;--dy:-720px;--r:-220deg"><rect x="-18" y="-18" width="36" height="36" fill="#e5252a"/></g>
  </g>
</svg>
