<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1930 2060" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Loading</title>
  <defs>
    <clipPath id="eyeClip"><circle r="268"/></clipPath>
    <style>
      .a { animation-iteration-count: infinite; animation-fill-mode: both; }

      /* spinner ring around the logo */
      #ring   { animation: spin 1.6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* the logo breathes like it's working hard */
      #badge  { animation: breathe 1.6s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

      /* the eye blinks now and then */
      #blink  { animation: blink 2.4s ease-in-out infinite; }
      @keyframes blink { 0%,84%,100% { transform: scaleY(1); } 91% { transform: scaleY(.08); } }

      /* the wedge inside the eye sweeps around like a clock hand */
      #hand   { animation: spin .8s linear infinite; }

      /* bouncing dots (negative delays = no pause at start) */
      .dot { animation: bounce 1.2s ease-in-out infinite; }
      #d1 { animation-delay: -.3s; }
      #d2 { animation-delay: -.15s; }
      #d3 { animation-delay: 0s; }
      @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-90px); } }

      @media (prefers-reduced-motion: reduce) {
        #ring, #badge, #blink, #hand, .dot { animation: none !important; }
      }
    </style>
  </defs>

  <!-- origin = center of the logo -->
  <g transform="translate(965 900)">

    <!-- spinner ring: light track + two arcs -->
    <circle r="830" fill="none" stroke="#efe7fb" stroke-width="70"/>
    <g id="ring">
      <circle r="830" fill="none" stroke="#411f96" stroke-width="70" stroke-linecap="round" stroke-dasharray="1300 3915"/>
      <circle r="830" fill="none" stroke="#ac5fe6" stroke-width="70" stroke-linecap="round" stroke-dasharray="600 4615" stroke-dashoffset="-2600"/>
    </g>

    <!-- the OG logo -->
    <g id="badge">
      <!-- G -->
      <path transform="translate(-945 -893)" fill="#411f96" fill-rule="evenodd" d="
        M1518 454 C1370 285 1200 220 970 220 C560 220 260 560 260 905
        C260 1260 540 1566 960 1566 C1400 1566 1630 1250 1630 875
        L1630 818 L930 818 L930 1070 L1312 1075
        C1270 1240 1130 1324 960 1324 C700 1324 563 1130 563 907
        C563 680 730 490 970 490 C1120 490 1230 550 1316 656 Z"/>

      <!-- O (eye) -->
      <g transform="translate(12 4)">
        <g id="blink">
          <circle r="268" fill="#000"/>
          <g clip-path="url(#eyeClip)">
            <g id="hand">
              <path d="M0 0 L268 0 A268 268 0 0 1 0 268 Z" fill="#ac5fe6"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- bouncing dots -->
  <g fill="#411f96">
    <circle id="d1" class="dot" cx="795"  cy="1960" r="45"/>
    <circle id="d2" class="dot" cx="965"  cy="1960" r="45"/>
    <circle id="d3" class="dot" cx="1135" cy="1960" r="45"/>
  </g>
</svg>
